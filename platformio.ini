[esp32_base]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
extra_scripts = pre:load_env.py

lib_deps =
  lovyan03/LovyanGFX @ ^1.2.0
  bblanchon/ArduinoJson @ ^7.2.1

build_flags =
  ; Enable USB-CDC on boot for ESP32-C3 Super Mini serial monitor
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1

[env:esp32-c3-supermini]
extends = esp32_base

[env:esp32-c3-supermini-ota]
extends = esp32_base
upload_protocol = espota
upload_port = flightclock.local

[env:native]
platform = native
build_flags =
  -std=gnu++17
  -Iinclude
test_build_src = no
